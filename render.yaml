services:
  - type: web
    name: fatakforecast-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
      - key: RAILKIT_API_KEY
        sync: false
      - key: IPSTACK_API_KEY
        sync: false
